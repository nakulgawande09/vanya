name: android-build

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match platform/android/java/app/config.gradle of the pinned Godot version (4.7.2-stable).
  ANDROID_PACKAGES: "platform-tools platforms;android-36 build-tools;36.1.0 ndk;29.0.14206865"
  BUILD_TOOLS_VERSION: "36.1.0"

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ${{ env.ANDROID_PACKAGES }}

      - name: Cache Godot and export templates
        uses: actions/cache@v4
        with:
          path: |
            .tools
            ~/.local/share/godot/export_templates
          key: godot-android-${{ hashFiles('.godot-version') }}

      - name: Set up Godot, templates and GdUnit4
        id: godot
        run: echo "bin=$(tools/setup_godot.sh --templates | tail -n 1)" >> "$GITHUB_OUTPUT"

      - name: Point Godot at the Android SDK and JDK
        run: |
          minor="$(cut -d. -f1,2 < .godot-version)"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${minor}.tres <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          SETTINGS

      - name: Debug keystore
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/debug.keystore" -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/debug.keystore"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Import project
        run: ${{ steps.godot.outputs.bin }} --headless --path client --import

      - name: Export debug APK
        run: |
          mkdir -p out/android
          ${{ steps.godot.outputs.bin }} --headless --path client --install-android-build-template \
            --export-debug "Android Debug" ../out/android/vanya-debug.apk
          test -s out/android/vanya-debug.apk

      - name: 16 KB page-size check
        run: tools/check_16kb.sh out/android/vanya-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: vanya-debug-apk
          path: out/android/vanya-debug.apk

      # Release AAB only for version tags, signed with the upload key from repository secrets:
      # ANDROID_UPLOAD_KEYSTORE_BASE64, ANDROID_UPLOAD_KEY_ALIAS, ANDROID_UPLOAD_KEY_PASSWORD.
      - name: Release keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then echo "Upload keystore secrets are not set" >&2; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          {
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/upload.keystore"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$KEY_ALIAS"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Export release AAB
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ${{ steps.godot.outputs.bin }} --headless --path client \
            --export-release "Android Release" ../out/android/vanya-release.aab
          test -s out/android/vanya-release.aab
          rm -f "$RUNNER_TEMP/upload.keystore"

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: vanya-release-aab
          path: out/android/vanya-release.aab
